<style>
:root{--bg:#fbfaf6;--paper:#fffdf8;--brick:#a94331;--brick-dark:#7d2d22;--ink:#33271f;--soft:#806d59;--line:#dccfbd;--line2:#ece4d8;--frame:8px;--header:78px;--tabs:46px;--thumb:76px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg)}body{font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}button{font:inherit}
.frame{position:fixed;inset:0;z-index:100;pointer-events:none}.frame:before,.frame:after{content:"";position:absolute;left:4px;right:4px;height:1px;background:var(--brick);opacity:.65}.frame:before{top:4px}.frame:after{bottom:4px}.frame .v{position:absolute;top:4px;bottom:4px;width:1px;background:var(--brick);opacity:.65}.frame .left{left:4px}.frame .right{right:4px}
.header{position:fixed;z-index:80;top:var(--frame);left:var(--frame);right:var(--frame);height:calc(var(--header) + var(--tabs));background:rgba(251,250,246,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{height:var(--header);display:grid;grid-template-columns:42px 1fr 42px;align-items:center}.logo{display:block;width:min(180px,55vw);max-height:58px;height:auto;object-fit:contain;margin:auto}.hamb{width:21px;height:15px;margin:auto;display:flex;flex-direction:column;justify-content:space-between}.hamb span{height:1px;background:var(--brick);width:100%}.hamb span:nth-child(2){width:14px}.hamb span:nth-child(3){width:8px}.leaf{width:25px;height:29px;margin:auto;position:relative;transform:rotate(-28deg)}.leaf:before{content:"";position:absolute;left:12px;bottom:0;width:1px;height:29px;background:var(--brick)}.leaf:after{content:"";position:absolute;left:8px;top:8px;width:10px;height:7px;border-top:1px solid var(--brick);border-right:1px solid var(--brick);transform:rotate(-20deg);box-shadow:-5px 8px 0 -1px var(--bg),6px 7px 0 -1px var(--bg)}
.tabs{height:var(--tabs);display:flex;align-items:flex-end;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(220,207,189,.5);touch-action:pan-x}.tabs::-webkit-scrollbar{display:none}.tab{position:relative;flex:0 0 auto;border:0;background:transparent;color:var(--soft);padding:0 13px 10px;white-space:nowrap;font-size:14px;cursor:pointer}.tab:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--brick);transform:scaleX(0);transition:transform .2s}.tab.active{color:var(--brick);font-weight:600}.tab.active:after{transform:scaleX(1)}
.track{position:fixed;inset:0;z-index:10;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}.track::-webkit-scrollbar{display:none}
.page{position:relative;flex:0 0 100vw;width:100vw;height:100dvh;scroll-snap-align:start;overflow-y:auto;overflow-x:hidden;padding:calc(var(--frame) + var(--header) + var(--tabs) + 17px) calc(var(--frame) + 12px) calc(var(--frame) + 30px);overscroll-behavior-y:contain;touch-action:pan-y}.page>*{touch-action:pan-y}
.cover{display:flex;align-items:center;justify-content:center;text-align:center;padding-top:calc(var(--header) + 10px)}.cover-logo{width:min(82vw,420px);max-height:190px;height:auto;object-fit:contain;margin-bottom:18px}.place{margin:0;color:var(--soft);font:500 10px Montserrat,sans-serif;letter-spacing:.34em;text-transform:uppercase}.rule{width:85px;height:1px;margin:23px auto 18px;background:var(--brick);opacity:.55}.hint{margin:0;color:var(--soft);font-size:15px;font-style:italic}.hint span{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;margin-left:7px;border:1px solid var(--line);border-radius:50%;color:var(--brick);animation:nudge 1.8s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.category{max-width:900px;margin:auto}.hero{position:relative;min-height:190px;margin-bottom:15px;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#fffdf8,#f3ede2);box-shadow:0 10px 30px rgba(67,43,27,.07)}.hero.has-image{background-size:cover;background-position:center}.hero.has-image .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(30,20,15,.68),rgba(30,20,15,.22))}.hero-content{position:relative;z-index:2;width:calc(100% - 110px);padding:18px}.orn{margin:0;color:var(--brick);font-size:25px;line-height:1}.hero-title{margin:4px 0 0;color:var(--brick-dark);font-size:clamp(30px,8vw,48px);font-weight:600;line-height:1}.hero-sub{margin:8px auto 0;color:var(--soft);font-size:14px;line-height:1.3;font-style:italic;max-width:55ch}.hero.has-image .orn,.hero.has-image .hero-title,.hero.has-image .hero-sub{color:#fff}.hero-btn{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:38px;height:38px;border:1px solid rgba(255,255,255,.65);border-radius:50%;background:rgba(255,253,248,.94);color:var(--brick);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:23px;line-height:1}.hero-btn:disabled{opacity:.35;cursor:default}.hero-btn:active:not(:disabled){transform:translateY(-50%) scale(.92)}.hero-btn.prev{left:10px}.hero-btn.next{right:10px}.hero-number{position:absolute;z-index:3;bottom:9px;left:50%;transform:translateX(-50%);font:8px Montserrat,sans-serif;letter-spacing:.15em;color:var(--soft)}.hero.has-image .hero-number{color:#fff}
.menu{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(67,43,27,.06);overflow:hidden;position:relative}.menu:before,.menu:after{content:"";position:absolute;width:24px;height:24px;border-color:var(--brick);opacity:.25;pointer-events:none}.menu:before{left:9px;top:9px;border-top:1px solid;border-left:1px solid}.menu:after{right:9px;bottom:9px;border-right:1px solid;border-bottom:1px solid}.items{padding:4px 12px}.item{display:grid;grid-template-columns:var(--thumb) minmax(0,1fr);gap:12px;padding:12px 3px;border-bottom:1px dotted var(--line);align-items:center}.item:last-child{border-bottom:0}.item-photo{width:var(--thumb);height:var(--thumb);border-radius:9px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,#f3ecdf,#ebe0cf);display:flex;align-items:center;justify-content:center;flex:none}.item-photo img{width:100%;height:100%;display:block;object-fit:cover}.photo-placeholder{font:500 8px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);text-align:center;line-height:1.3;padding:5px}.photo-placeholder span{display:block;font:20px serif;color:var(--brick);margin-bottom:2px}.item-main{min-width:0}.name-row{display:flex;align-items:baseline;gap:8px}.name{min-width:0;color:var(--ink);font-size:18px;font-weight:600;line-height:1.08}.leader{flex:1;min-width:10px;border-bottom:1px dotted var(--line);margin-bottom:4px}.price{color:var(--brick);font-size:16px;font-weight:600;white-space:nowrap}.desc{margin:5px 0 0;color:var(--soft);font-size:13px;line-height:1.28;font-style:italic}.no-price .name{flex:1}.end{text-align:center;color:var(--soft);padding:18px 5px 8px;font-size:13px;font-style:italic}.end strong{color:var(--brick);font-style:normal}
/* Image configuration hint */
.image-note{margin:10px 2px 0;color:#9a8873;font:9px Montserrat,sans-serif;letter-spacing:.04em;text-align:center}
@media(min-width:700px){:root{--frame:13px;--header:82px;--tabs:50px;--thumb:92px}.logo{width:220px;max-height:65px}.brand{grid-template-columns:70px 1fr 70px}.page{padding-left:calc(var(--frame) + 55px);padding-right:calc(var(--frame) + 55px);padding-top:calc(var(--frame) + var(--header) + var(--tabs) + 25px)}.hero{min-height:220px}.hero-title{font-size:50px}.item{padding:15px 4px}.name{font-size:21px}.desc{font-size:15px}.price{font-size:18px}}
@media(max-width:390px){:root{--header:68px;--tabs:43px;--thumb:64px}.logo{width:min(155px,52vw)}.tab{font-size:13px;padding-left:11px;padding-right:11px}.tab:after{left:10px;right:10px}.page{padding-left:calc(var(--frame) + 10px);padding-right:calc(var(--frame) + 10px)}.hero{min-height:145px}.hero-content{width:calc(100% - 82px);padding:10px}.hero-title{font-size:27px}.hero-sub{font-size:12.5px}.hero-btn{width:32px;height:32px}.item{grid-template-columns:var(--thumb) minmax(0,1fr);gap:9px;padding:10px 1px}.name{font-size:16.5px}.price{font-size:15px}.desc{font-size:12px}.photo-placeholder{font-size:7px}.photo-placeholder span{font-size:17px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

  // "Ürün Adı":"images/products/dosya-adi.jpg"
};

const track=document.getElementById('track');
const tabsEl=document.getElementById('tabs');
const tabs=[];
const pages=[];

function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}

function makePhoto(path, alt){
  const box=el('div','item-photo');
  if(path){
    const img=document.createElement('img');
    img.src=path;
    img.alt=alt||'';
    img.loading='lazy';
    img.onerror=()=>{box.innerHTML='<div class="photo-placeholder"><span>⌁</span>Fotoğraf</div>';};
    box.appendChild(img);
  }else{
    box.innerHTML='<div class="photo-placeholder"><span>⌁</span>Fotoğraf ekle</div>';
  }
  return box;
}

MENU.forEach((cat,i)=>{
  const page=el('section','page');
  page.id='cat-'+i;
  const wrap=el('div','category');

  const hero=el('div','hero');
  const image=CATEGORY_IMAGES[i];
  if(image){hero.classList.add('has-image');hero.style.backgroundImage=`url("${image}")`;hero.append(el('div','shade'));}

  const content=el('div','hero-content');
  content.append(el('p','orn','❧'));
  content.append(el('h1','hero-title',cat.name));
  if(cat.sub)content.append(el('p','hero-sub',cat.sub));
  const num=el('div','hero-number',`${String(i+1).padStart(2,'0')} / ${String(MENU.length).padStart(2,'0')}`);
  content.append(num);

  const prev=el('button','hero-btn prev','‹');
  prev.type='button';prev.setAttribute('aria-label','Önceki kategori');prev.onclick=e=>{e.stopPropagation();go(i-1)};
  const next=el('button','hero-btn next','›');
  next.type='button';next.setAttribute('aria-label','Sonraki kategori');next.onclick=e=>{e.stopPropagation();go(i+1)};
  if(i===0)prev.disabled=true;
  if(i===MENU.length-1)next.disabled=true;
  hero.append(prev,content,next);

  const menu=el('div','menu');
  const items=el('div','items');
  cat.items.forEach(item=>{
    const row=el('article','item');
    row.append(makePhoto(ITEM_IMAGES[item.n],item.n));

    const main=el('div','item-main');
    const nr=el('div','name-row');
    nr.append(el('span','name',item.n));
    if(item.p){nr.append(el('span','leader'));nr.append(el('span','price',item.p));}
    main.append(nr);
    if(item.d)main.append(el('p','desc',item.d));
    row.append(main);
    items.append(row);
  });
  menu.append(items);

  const end=el('div','end');
  if(i<MENU.length-1)end.innerHTML=`Sonraki kategori: <strong>${MENU[i+1].name}</strong> · sağa kaydır`;
  else end.innerHTML=`Menünün sonu · <strong>Dükkan Çanakkale</strong>`;

  wrap.append(hero,menu,end);page.append(wrap);track.append(page);pages.push(page);
  const tab=el('button','tab',cat.name);tab.type='button';tab.dataset.index=i;tab.onclick=()=>go(i);tabsEl.append(tab);tabs.push(tab);
});

function go(i){
  if(i<0||i>=MENU.length)return;
  track.scrollTo({left:(i+1)*track.clientWidth,behavior:'smooth'});
  setActive(i);
}
function currentIndex(){return Math.round(track.scrollLeft/Math.max(track.clientWidth,1))-1}
function setActive(i){
  tabs.forEach((t,n)=>t.classList.toggle('active',n===i));
  if(i>=0&&tabs[i])tabs[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
let timer;
track.addEventListener('scroll',()=>{
  clearTimeout(timer);
  timer=setTimeout(()=>setActive(currentIndex()),60);
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(currentIndex()+1);
  if(e.key==='ArrowLeft')go(currentIndex()-1);
});
setActive(-1);
</script>
</body>
</html>
