<!DOCTYPE html>
<html lang="tr">
<head>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F5ED;--paper:#FCFAF5;--brick:#A94331;--brick-dark:#7D2D22;--ink:#33271F;--soft:#806D59;--line:#D9CBB7;--line2:#E9E0D3;--frame:9px;--header:78px;--tabs:45px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg)}body{font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}button{font:inherit}
.frame{position:fixed;inset:0;z-index:100;pointer-events:none}.frame:before,.frame:after{content:"";position:absolute;left:4px;right:4px;height:1px;background:var(--brick);opacity:.7}.frame:before{top:4px}.frame:after{bottom:4px}.frame .v{position:absolute;top:4px;bottom:4px;width:1px;background:var(--brick);opacity:.7}.frame .left{left:4px}.frame .right{right:4px}
.header{position:fixed;z-index:80;top:var(--frame);left:var(--frame);right:var(--frame);height:calc(var(--header) + var(--tabs));background:rgba(248,245,237,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{height:var(--header);display:grid;grid-template-columns:42px 1fr 42px;align-items:center}.logo{display:block;width:min(180px,55vw);max-height:58px;height:auto;object-fit:contain;margin:auto}.hamb{width:21px;height:15px;margin:auto;display:flex;flex-direction:column;justify-content:space-between}.hamb span{height:1px;background:var(--brick);width:100%}.hamb span:nth-child(2){width:14px}.hamb span:nth-child(3){width:8px}.leaf{width:25px;height:29px;margin:auto;position:relative;transform:rotate(-28deg)}.leaf:before{content:"";position:absolute;left:12px;bottom:0;width:1px;height:29px;background:var(--brick)}.leaf:after{content:"";position:absolute;left:8px;top:8px;width:10px;height:7px;border-top:1px solid var(--brick);border-right:1px solid var(--brick);transform:rotate(-20deg);box-shadow:-5px 8px 0 -1px var(--bg),6px 7px 0 -1px var(--bg)}
.tabs{height:var(--tabs);display:flex;align-items:flex-end;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(217,203,183,.5);touch-action:pan-x}.tabs::-webkit-scrollbar{display:none}.tab{position:relative;flex:0 0 auto;border:0;background:transparent;color:var(--soft);padding:0 13px 10px;white-space:nowrap;font-size:14px;cursor:pointer}.tab:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--brick);transform:scaleX(0);transition:transform .2s}.tab.active{color:var(--brick);font-weight:600}.tab.active:after{transform:scaleX(1)}

/* ÇÖZÜM 2: Birden fazla sayfa atlamasını önlemek için "scroll-snap-stop: always" eklendi */
.track{position:fixed;inset:0;z-index:10;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}.track::-webkit-scrollbar{display:none}
.page{position:relative;flex:0 0 100vw;width:100vw;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;padding:calc(var(--frame) + var(--header) + var(--tabs) + 17px) calc(var(--frame) + 14px) calc(var(--frame) + 30px);overscroll-behavior-y:contain}

.cover{display:flex;align-items:center;justify-content:center;text-align:center;padding-top:calc(var(--header) + 10px)}.cover-logo{width:min(82vw,420px);max-height:190px;height:auto;object-fit:contain;margin-bottom:18px}.place{margin:0;color:var(--soft);font:500 10px Montserrat,sans-serif;letter-spacing:.34em;text-transform:uppercase}.rule{width:85px;height:1px;margin:23px auto 18px;background:var(--brick);opacity:.55}.hint{margin:0;color:var(--soft);font-size:15px;font-style:italic}.hint span{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;margin-left:7px;border:1px solid var(--line);border-radius:50%;color:var(--brick);animation:nudge 1.8s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.category{max-width:850px;margin:auto}.hero{position:relative;min-height:145px;margin-bottom:16px;border:1px solid var(--line);border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 15% 80%,rgba(169,67,49,.09),transparent 35%),radial-gradient(circle at 85% 20%,rgba(169,67,49,.08),transparent 35%),linear-gradient(135deg,#FCFAF5,#F2EBDD);box-shadow:0 10px 30px rgba(67,43,27,.06)}.hero:before,.hero:after{content:"";position:absolute;width:30px;height:30px;border-color:var(--brick);opacity:.38}.hero:before{top:9px;left:9px;border-top:1px solid;border-left:1px solid}.hero:after{right:9px;bottom:9px;border-right:1px solid;border-bottom:1px solid}.hero.has-image{background-size:cover;background-position:center}.hero.has-image .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,23,17,.62),rgba(35,23,17,.2))}.hero-content{position:relative;z-index:2;width:calc(100% - 100px);padding:14px}.orn{margin:0;color:var(--brick);font-size:24px;line-height:1}.hero-title{margin:3px 0 0;color:var(--brick-dark);font-size:clamp(28px,8vw,45px);font-weight:600;line-height:1}.hero-sub{margin:7px auto 0;color:var(--soft);font-size:14px;line-height:1.25;font-style:italic;max-width:55ch}.hero.has-image .orn,.hero.has-image .hero-title,.hero.has-image .hero-sub{color:#fff}.hero-btn{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:rgba(252,250,245,.92);color:var(--brick);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;line-height:1}.hero-btn:active{transform:translateY(-50%) scale(.92)}.hero-btn.prev{left:10px}.hero-btn.next{right:10px}.hero-number{position:absolute;z-index:3;bottom:8px;left:50%;transform:translateX(-50%);font:8px Montserrat,sans-serif;letter-spacing:.15em;color:var(--soft)}.hero.has-image .hero-number{color:#fff}
.menu{background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(67,43,27,.06);overflow:hidden;position:relative}.menu:before{content:"";position:absolute;left:9px;top:9px;width:25px;height:25px;border-top:1px solid var(--brick);border-left:1px solid var(--brick);opacity:.3}.menu:after{content:"";position:absolute;right:9px;bottom:9px;width:25px;height:25px;border-right:1px solid var(--brick);border-bottom:1px solid var(--brick);opacity:.3}.items{padding:5px 15px}.item{padding:15px 2px;border-bottom:1px dotted var(--line)}.item:last-child{border-bottom:0}.name-row{display:flex;align-items:baseline;gap:8px}.name{min-width:0;color:var(--ink);font-size:19px;font-weight:600;line-height:1.1}.leader{flex:1;min-width:10px;border-bottom:1px dotted var(--line);margin-bottom:4px}.price{color:var(--brick);font-size:17px;font-weight:600;white-space:nowrap}.desc{margin:5px 0 0;color:var(--soft);font-size:13.5px;line-height:1.3;font-style:italic}.no-price .name{flex:1}.end{text-align:center;color:var(--soft);padding:18px 5px 8px;font-size:13px;font-style:italic}.end strong{color:var(--brick);font-style:normal}
@media(min-width:700px){:root{--frame:13px;--header:82px;--tabs:50px}.logo{width:220px;max-height:65px}.brand{grid-template-columns:70px 1fr 70px}.page{padding-left:calc(var(--frame) + 55px);padding-right:calc(var(--frame) + 55px);padding-top:calc(var(--frame) + var(--header) + var(--tabs) + 25px)}.hero{min-height:200px}.hero-title{font-size:50px}.item{padding:17px 4px}.name{font-size:21px}.desc{font-size:15px}.price{font-size:18px}}
@media(max-width:390px){:root{--header:68px;--tabs:43px}.logo{width:min(155px,52vw)}.tab{font-size:13px;padding-left:11px;padding-right:11px}.tab:after{left:10px;right:10px}.page{padding-left:calc(var(--frame) + 12px);padding-right:calc(var(--frame) + 12px)}.hero{min-height:122px}.hero-content{width:calc(100% - 82px);padding:10px}.hero-title{font-size:27px}.hero-sub{font-size:12.5px}.hero-btn{width:32px;height:32px}.item{padding:12px 1px}.name{font-size:17px}.price{font-size:15.5px}.desc{font-size:12.5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="header">
  <div class="brand">
    <div class="hamb" aria-hidden="true"><span></span><span></span><span></span></div>
    <img class="logo" src="dukkan-logo-transparent.png" alt="Dükkan - Your Daily Escape">

{n:"Barbekü Soslu Tavuk",d:"Jülyen tavuk, kapya biber, yeşil biber, soğan, barbekü sos"},{n:"Patlıcan ve Parmesanlı Tavuk",d:"Jülyen tavuk, ızgara patlıcan, kokteyl domates, krema, parmesan"},{n:"Yeşil Soslu Tavuk",d:"Jülyen tavuk, krema, ıspanak, bezelye, kuşkonmaz"},{n:"Sweet Chilli Soslu Tavuk",d:"Jülyen tavuk, sweet chili sos, frenk soğan"},{n:"Mantarlı Hardallı Tavuk",d:"Jülyen tavuk, sotelenmiş renkli biberler, soğan, mantar, hardal, krema"},{n:"Sebzeli Tavuk",d:"Jülyen tavuk, brokoli, karnabahar, havuç, krema, parmesan"},{n:"Özel Beşamel Soslu Tavuk",d:"Jülyen tavuk, soğan, süt, tereyağı, un, muskat"},{n:"Kremalı Kuru Domatesli Tavuk",d:"Jülyen tavuk, arpacık soğan, kuru domates, kuru reyhan, krema"},{n:"Meksika Soslu Tavuk",d:"Jülyen tavuk, sotelenmiş renkli biberler, mısır, jalapeno, soğan, acılı domates sos"}]},
{name:"Salatalar",items:[

{name:"Espresso Bazlı Kahveler",items:[

{n:"Çay",p:"70₺"},{n:"Fincan Çay",p:"100₺"},{n:"Ballı Süt",p:"210₺"},{n:"Chai Tea Latte",p:"200₺"},{n:"Salep",p:"210₺"},{n:"Sıcak Çikolata (Beyaz, Sütlü)",p:"220₺"},{n:"Bitki Çayları (Adaçayı, Papatya, Kış Çayı, Ihlamur, Kuşburnu, Kiraz Sapı, Yeşil Çay)",p:"170₺"}]},

{name:"Smoothies",items:[
{n:"Berrylicious",d:"Muz, beyaz çikolata, bal, badem ezmesi, orman meyvesi, süt, yoğurt",p:"270₺"},{n:"Strawberry Kiss",d:"Taze çilek, muz, yer fıstığı ezmesi, karamel, süt, yoğurt",p:"270₺"},{n:"Detox Breeze",d:"Yeşil Bayramiç elması, salatalık, nane, yulaf, coconut özü, süt, yoğurt",p:"270₺"}]},
{name:"Mocktails",items:[
{n:"Lady in Red",d:"Böğürtlen, frambuaz, frenk üzümü, taze fesleğen, lime, şeker kamışı",p:"270₺"},{n:"Greentail",d:"Kuzu kulağı, salatalık, nane, lime, şeker kamışı, kaya tuzu",p:"270₺"},{n:"Yes Peaches",d:"Şeftali, melisa çayı, tarçın çubuğu, lime, şeker kamışı, gül",p:"270₺"},{n:"Oh My Lime",d:"Nane, lime, limon, şeker kamışı, kaya tuzu",p:"270₺"}]}
];

/* Optional hero images. Add paths here whenever you have real photos. */
const CATEGORY_IMAGES={
  //0:"images/baslangiclar.jpg",
  //1:"images/omlet.jpg",
  //2:"images/bowllar.jpg",
  //3:"images/tavuk.jpg",
  //4:"images/salatalar.jpg",
  //5:"images/kahveler.jpg",
  //6:"images/sicak-icecekler.jpg",
  //7:"images/soguk-icecekler.jpg",
  //8:"images/soguk-kahveler.jpg",
  //9:"images/demlemeler.jpg",
  //10:"images/tatlilar.jpg",
  //11:"images/smoothies.jpg",
  //12:"images/mocktails.jpg"
};

const track=document.getElementById('track');
const tabsEl=document.getElementById('tabs');
const tabs=[];
const pages=[];

function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}

MENU.forEach((cat,i)=>{
  const page=el('section','page');
  page.id='cat-'+i;

  const wrap=el('div','category');
  const hero=el('div','hero');
  const image=CATEGORY_IMAGES[i];
  if(image){hero.classList.add('has-image');hero.style.backgroundImage=`url("${image}")`;hero.append(el('div','shade'))}

  const content=el('div','hero-content');
  content.append(el('p','orn','❧'));
  content.append(el('h1','hero-title',cat.name));
  if(cat.sub)content.append(el('p','hero-sub',cat.sub));
  const num=el('div','hero-number',`${String(i+1).padStart(2,'0')} / ${String(MENU.length).padStart(2,'0')}`);
  content.append(num);

  const prev=el('button','hero-btn prev','‹');prev.type='button';prev.setAttribute('aria-label','Önceki kategori');prev.onclick=e=>{e.stopPropagation();go(i-1)};
  const next=el('button','hero-btn next','›');next.type='button';next.setAttribute('aria-label','Sonraki kategori');next.onclick=e=>{e.stopPropagation();go(i+1)};
  if(i===0)prev.disabled=true;
  if(i===MENU.length-1)next.disabled=true;
  hero.append(prev,content,next);

  const menu=el('div','menu');
  const items=el('div','items');
  cat.items.forEach(item=>{
    const row=el('article','item');
    const nr=el('div','name-row');nr.append(el('span','name',item.n));
    
    // ÇÖZÜM 1: Ürünün fiyatı (item.p) tanımlanmamışsa "999₺" yaz.
    const priceText = item.p ? item.p : ""; 
    
    nr.append(el('span','leader'));
    nr.append(el('span','price',priceText));
    
    row.append(nr);
    if(item.d)row.append(el('p','desc',item.d));
    items.append(row);
  });
  menu.append(items);

  const end=el('div','end');
  if(i<MENU.length-1)end.innerHTML=`Sonraki kategori: <strong>${MENU[i+1].name}</strong> · sağa kaydır`;
  else end.innerHTML=`Menünün sonu · <strong>Dükkan Çanakkale</strong>`;

  wrap.append(hero,menu,end);page.append(wrap);track.append(page);pages.push(page);

  const tab=el('button','tab',cat.name);tab.type='button';tab.dataset.index=i;tab.onclick=()=>go(i);tabsEl.append(tab);tabs.push(tab);
});

function go(i){
  if(i<0||i>=MENU.length)return;
  track.scrollTo({left:(i+1)*track.clientWidth,behavior:'smooth'});
  setActive(i);
}

function currentIndex(){return Math.round(track.scrollLeft/Math.max(track.clientWidth,1))-1}

function setActive(i){
  tabs.forEach((t,n)=>t.classList.toggle('active',n===i));
  if(i>=0&&tabs[i])tabs[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

let timer;
track.addEventListener('scroll',()=>{
  clearTimeout(timer);
  timer=setTimeout(()=>setActive(currentIndex()),60);
},{passive:true});

/* Keyboard support for desktop */
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(currentIndex()+1);
  if(e.key==='ArrowLeft')go(currentIndex()-1);
});

window.addEventListener('resize',()=>{
  const i=Math.max(-1,currentIndex());
  track.scrollLeft=(i+1)*track.clientWidth;
  setActive(i);
});

setActive(-1);
</script>
</body>
</html>
