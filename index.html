<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dükkan Menü</title>
    <!-- Swiper CSS (Sayfa geçiş efekti için) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <style>
        :root {
            --bg-color: #eaddc5; /* Menüdeki bej arkaplan */
            --accent-color: #9d3e34; /* Menüdeki kiremit/bordo renk */
            --text-dark: #3a2b25;
            --font-main: 'Georgia', serif;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-dark); 
            font-family: var(--font-main); 
            overflow: hidden; /* Dikey kaydırmayı Swiper'a bırakıyoruz */
        }

        /* Çerçeve Tasarımı (Görseldeki gibi) */
        .frame {
            position: fixed; top: 10px; bottom: 10px; left: 10px; right: 10px;
            border: 4px solid var(--accent-color);
            pointer-events: none; /* Tıklamaları engellemesin */
            z-index: 100;
        }
        .frame-inner {
            position: fixed; top: 16px; bottom: 16px; left: 16px; right: 16px;
            border: 2px solid var(--accent-color);
            pointer-events: none;
            z-index: 100;
        }

        /* Header / Logo alanı */
        .header {
            text-align: center;
            padding: 40px 20px 20px 20px;
            z-index: 10;
            position: relative;
        }
        .header h1 {
            color: var(--accent-color);
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: lowercase;
            font-weight: bold;
        }
        .header p {
            font-size: 0.7rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        /* Swiper Container */
        .swiper {
            width: 100%;
            height: calc(100vh - 120px); /* Header sonrası kalan alan */
        }

        .swiper-slide {
            padding: 0 30px 40px 30px;
            overflow-y: auto; /* Sayfa içi dikey kaydırma */
        }
        
        /* Sayfa içi scroll bar gizleme */
        .swiper-slide::-webkit-scrollbar { display: none; }

        .category-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-dark);
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Ürün Listesi */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            position: relative;
        }

        /* Noktalı çizgi efekti */
        .menu-item::after {
            content: "";
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            height: 1px;
            border-bottom: 1px dotted var(--text-dark);
            z-index: -1;
            opacity: 0.3;
        }

        .item-info {
            background-color: var(--bg-color);
            padding-right: 10px;
            max-width: 80%;
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .item-desc {
            font-size: 0.75rem;
            color: #5a4b45;
            margin-top: 4px;
            font-style: italic;
        }

        .item-price {
            background-color: var(--bg-color);
            padding-left: 10px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Alt navigasyon (Sayfa noktaları) */
        .swiper-pagination {
            bottom: 25px !important;
        }
        .swiper-pagination-bullet {
            background: var(--accent-color);
            opacity: 0.5;
        }
        .swiper-pagination-bullet-active {
            opacity: 1;
        }
        
        .swipe-hint {
            text-align: center;
            font-size: 0.8rem;
            color: var(--accent-color);
            opacity: 0.7;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

                </div>
            `).join('');

                    <div class="menu-list">

                    </div>

            `;
        });

        // Swiper'ı Başlat (Sayfa Geçiş Efekti)
        var swiper = new Swiper(".mySwiper", {
            effect: "coverflow",

            centeredSlides: true,
            slidesPerView: "auto",

                stretch: 0,
                depth: 100,

            },
            pagination: {

                clickable: true,
            },
        });
