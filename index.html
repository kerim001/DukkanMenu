<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dükkan Çanakkale</title>

<style>
  :root{
    --bg: #FBF7EF;
    --card: #FFFFFF;
    --brick: #7C2E20;
    --brick-deep: #571F15;
    --ink: #3B2A1D;
    --soft: #8B7A68;
    --line: #EAE0CE;
    --hero-expanded: 168px;
    --hero-collapsed: 74px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  .serif{font-family:"Cormorant Garamond",Georgia,serif;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  img{display:block;}

  /* ================= SPLASH ================= */
  #splash{
    position:fixed;inset:0;background:var(--bg);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;transition:opacity .45s ease, visibility .45s ease;
  }
  #splash.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #splash .logo{width:min(72vw,300px);height:auto;}
  #splash .leaf{width:34px;height:34px;color:var(--brick);margin:26px 0 18px;}
  #splash .place{font-size:14px;letter-spacing:0.25em;color:var(--soft);margin:0 0 40px;font-weight:600;}
  #splash .cta-label{font-size:15px;color:var(--soft);margin:0 0 14px;}
  #splash .cta-btn{
    width:54px;height:54px;border-radius:50%;border:1.5px solid var(--brick);
    color:var(--brick);display:flex;align-items:center;justify-content:center;
    transition:background .2s ease, color .2s ease;
  }
  #splash .cta-btn:active{background:var(--brick);color:#fff;}

  /* ================= APP SHELL ================= */
  #app{display:none;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
  #app.visible{display:flex;}

  .topbar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px 10px;
  }
  .icon-btn{width:30px;height:30px;color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .brand{display:flex;flex-direction:column;align-items:center;}
  .brand img{height:30px;width:auto;}
  .topbar-logo{position:absolute;left:50%;height:30px;width:auto;max-width:55vw;transform:translateX(-50%);}
  .leaf-icon{width:22px;height:22px;color:var(--brick);}

  .tabbar{
    flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
    padding:6px 18px 14px;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;padding:9px 18px;border-radius:999px;font-size:14.5px;
    color:var(--soft);background:transparent;white-space:nowrap;
    transition:background .2s ease,color .2s ease;
  }
  .tab.active{background:var(--brick);color:#fff;font-weight:600;}

  /* wraps hero + pager + list; this is the zone that listens for left/right swipes */
  #swipeZone{flex:1 1 auto;min-height:0;overflow:hidden;touch-action:pan-y;}
  #categoryTrack{display:flex;width:100%;height:100%;min-height:0;transition:transform .28s cubic-bezier(.22,.61,.36,1);will-change:transform;}
  .category-panel{position:relative;flex:0 0 100%;display:flex;flex-direction:column;min-height:0;overflow:hidden;}

  .hero{
    flex:0 0 auto;position:relative;margin:0 18px;border-radius:20px;overflow:hidden;
    height:var(--hero-expanded);background:var(--line);
    transition:height .18s ease-out, opacity .18s ease-out;
  }
  .hero .thumb-fallback{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--soft);gap:6px;background:linear-gradient(160deg,#EFE4CC,#E4D6B8);
  }
  .hero .thumb-fallback svg{width:30px;height:30px;opacity:.6;}
  .hero .thumb-fallback span{font-size:11px;letter-spacing:.03em;}
  .hero img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;}
  .hero-scrim{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.62) 100%);pointer-events:none;}
  .hero-text{position:absolute;left:18px;right:70px;bottom:14px;z-index:3;color:#fff;}
  .hero-text h2{margin:0 0 3px;font-size:23px;font-weight:700;line-height:1.05;}
  .hero-text p{margin:0;font-size:13px;opacity:.92;line-height:1.3;}
  .hero-arrow{
    position:absolute;top:50%;transform:translateY(-50%);z-index:4;
    width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);
    color:var(--brick);display:flex;align-items:center;justify-content:center;
  }
  .hero-arrow.prev{left:10px;}
  .hero-arrow.next{right:10px;}
  .hero-arrow svg{width:15px;height:15px;}

  .pager{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;height:30px;padding:0;overflow:hidden;transition:opacity .18s ease-out,height .18s ease-out;}
  .pager .dot{width:5px;height:5px;border-radius:50%;background:var(--brick);}
  .pager .count{font-size:12.5px;letter-spacing:.06em;color:var(--soft);}

  .list{flex:1 1 auto;overflow-y:auto;padding:4px 18px 8px;-webkit-overflow-scrolling:touch;}
  .cat-sub-note{font-size:12.5px;font-style:italic;color:var(--soft);margin:2px 2px 12px;}

  .card{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
  .card:last-child{border-bottom:none;}
  .card-thumb{flex:0 0 64px;width:64px;height:64px;border-radius:14px;overflow:hidden;position:relative;background:var(--line);}
  .card-thumb img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;}
  .card-thumb .thumb-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#EFE4CC,#E4D6B8);color:var(--soft);}
  .card-thumb .thumb-fallback svg{width:20px;height:20px;opacity:.6;}
  .card-body{flex:1 1 auto;min-width:0;}
  .card-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .card-name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:17.5px;color:var(--ink);line-height:1.2;}
  .card-price{flex:0 0 auto;font-size:14.5px;font-weight:600;color:var(--brick);white-space:nowrap;}
  .card-desc{margin:4px 0 0;font-size:13px;color:var(--soft);line-height:1.35;}
  .card.no-desc .card-body{display:flex;align-items:center;}
  .card.no-desc .card-row{width:100%;}

  .scroll-hint{display:flex;justify-content:center;padding:6px 0 4px;color:var(--soft);opacity:.6;animation:bob 1.6s ease-in-out infinite;}
  .scroll-hint svg{width:18px;height:18px;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}
  #swipeZone.swipe-next #hero,#swipeZone.swipe-next #pager,#swipeZone.swipe-next #list{animation:swipeNext .34s ease-out both;}
  #swipeZone.swipe-prev #hero,#swipeZone.swipe-prev #pager,#swipeZone.swipe-prev #list{animation:swipePrev .34s ease-out both;}
  @keyframes swipeNext{from{opacity:.2;transform:translateX(22px);}to{opacity:1;transform:translateX(0);}}
  @keyframes swipePrev{from{opacity:.2;transform:translateX(-22px);}to{opacity:1;transform:translateX(0);}}
  @media (prefers-reduced-motion: reduce){.scroll-hint{animation:none;}#swipeZone.swipe-next #hero,#swipeZone.swipe-next #pager,#swipeZone.swipe-next #list,#swipeZone.swipe-prev #hero,#swipeZone.swipe-prev #pager,#swipeZone.swipe-prev #list{animation:none;}}
</style>

// ---- Turkish-safe slug for building image file paths ----
const TR_MAP = {'İ':'i','I':'i','ı':'i','Ş':'s','ş':'s','Ğ':'g','ğ':'g','Ü':'u','ü':'u','Ö':'o','ö':'o','Ç':'c','ç':'c'};
function slug(str){
  return str.split('').map(ch => TR_MAP[ch] || ch).join('')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

  cat.slug = slug(cat.name);
  cat.items.forEach(it => { it.slug = slug(it.n); });
});

const splash = document.getElementById('splash');
const app = document.getElementById('app');
const tabbar = document.getElementById('tabbar');
const swipeZone = document.getElementById('swipeZone');
const categoryTrack = document.getElementById('categoryTrack');

let current = 0;
const ASSET_VERSION = '20260919-1';

function pad(n){ return n < 10 ? '0' + n : '' + n; }

// FOTOĞRAF EKLEME: index.html ile aynı seviyede images klasörü oluştur.
// Örnek: images/bowllar/hero.jpg ve images/bowllar/avokadolu-tavuk-bowl.jpg
// Kategori ve ürün klasör/dosya adları aşağıdaki slug düzenine göre otomatik oluşur.
// Desteklenen uzantı şu anda yalnızca .jpg; farklı uzantı kullanırsan bu iki yolu değiştir.
function heroPath(cat){ return 'images/' + cat.slug + '/hero.jpg?v=' + ASSET_VERSION; }
function itemPath(cat, it){ return 'images/' + cat.slug + '/' + it.slug + '.jpg?v=' + ASSET_VERSION; }

function setImage(imgEl, fallbackEl, src){
  fallbackEl.style.display = 'flex';
  imgEl.style.display = 'none';
  imgEl.onload = () => { fallbackEl.style.display = 'none'; imgEl.style.display = ''; };
  imgEl.onerror = () => { fallbackEl.style.display = 'flex'; imgEl.style.display = 'none'; };
  imgEl.src = src;
}

function renderPanel(panel, cat, index){
  const hero = panel.querySelector('.hero');
  const heroImg = panel.querySelector('#heroImg');
  const heroFallback = panel.querySelector('#heroFallback');
  const heroTitle = panel.querySelector('#heroTitle');
  const heroSub = panel.querySelector('#heroSub');
  const pager = panel.querySelector('.pager');
  const pagerCount = panel.querySelector('#pagerCount');
  const list = panel.querySelector('.list');

  hero.style.height = 'var(--hero-expanded)';
  hero.style.opacity = '1';
  pager.style.opacity = '1';
  pager.style.height = '30px';
  setImage(heroImg, heroFallback, heroPath(cat));
  heroImg.alt = cat.name;
  heroTitle.textContent = cat.name;
  heroSub.textContent = cat.tagline || '';
  pagerCount.textContent = pad(index + 1) + ' / ' + pad(MENU.length);

  panel.querySelector('.prev').addEventListener('click', () => goTo(index - 1));
  panel.querySelector('.next').addEventListener('click', () => goTo(index + 1));

  list.innerHTML = '';
  if (cat.sub) {
    const note = document.createElement('p');
    note.className = 'cat-sub-note';
    note.textContent = cat.sub;
    list.appendChild(note);
  }
  cat.items.forEach(it => {
    const card = document.createElement('div');
    card.className = 'card' + (it.d ? '' : ' no-desc');
    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'card-thumb';
    const fb = document.createElement('div');
    fb.className = 'thumb-fallback';
    fb.innerHTML = THUMB_SVG;
    const img = document.createElement('img');
    img.alt = it.n;
    img.loading = 'lazy';
    img.decoding = 'async';
    thumbWrap.append(fb, img);
    setImage(img, fb, itemPath(cat, it));
    card.appendChild(thumbWrap);

    const body = document.createElement('div');
    body.className = 'card-body';
    const row = document.createElement('div');
    row.className = 'card-row';
    const name = document.createElement('span');
    name.className = 'card-name';
    name.textContent = it.n;
    row.appendChild(name);
    if (it.p) {
      const price = document.createElement('span');
      price.className = 'card-price';
      price.textContent = it.p;
      row.appendChild(price);
    }
    body.appendChild(row);
    if (it.d) {
      const desc = document.createElement('p');
      desc.className = 'card-desc';
      desc.textContent = it.d;
      body.appendChild(desc);
    }
    card.appendChild(body);
    list.appendChild(card);
  });

  list.addEventListener('scroll', () => {
    const t = Math.min(Math.max(list.scrollTop / COLLAPSE_DISTANCE, 0), 1);
    hero.style.height = (HERO_EXPANDED - (HERO_EXPANDED - HERO_COLLAPSED) * t) + 'px';
    hero.style.opacity = String(1 - t);
    pager.style.opacity = String(1 - t);
    pager.style.height = (30 * (1 - t)) + 'px';
  }, { passive: true });
}

function render(){
  const template = categoryTrack.firstElementChild.cloneNode(true);
  categoryTrack.innerHTML = '';

  tabbar.innerHTML = '';
  MENU.forEach((c, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (i === current ? ' active' : '');
    tab.textContent = c.name;
    tab.addEventListener('click', () => goTo(i));
    tabbar.appendChild(tab);
    if (i === current) requestAnimationFrame(() => tab.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' }));

    const panel = template.cloneNode(true);
    renderPanel(panel, c, i);
    categoryTrack.appendChild(panel);
  });
  categoryTrack.style.transform = 'translateX(-' + (current * 100) + '%)';
}

function goTo(i){
  const next = (i + MENU.length) % MENU.length;
  current = next;
  categoryTrack.style.transform = 'translateX(-' + (current * 100) + '%)';
  tabbar.querySelectorAll('.tab').forEach((tab, index) => {
    tab.classList.toggle('active', index === current);
    if (index === current) tab.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  });
}

document.getElementById('enterBtn').addEventListener('click', () => {
  splash.classList.add('hidden');
  app.classList.add('visible');
  render();
});

const COLLAPSE_DISTANCE = 120; // px of scroll over which the hero fully collapses
const HERO_EXPANDED = 168;
const HERO_COLLAPSED = 0;
// ---- the track follows horizontal pointer movement and snaps on release ----
let pointerStartX = 0;
let pointerStartY = 0;
let pointerId = null;
let isDragging = false;

swipeZone.addEventListener('pointerdown', event => {
  if (event.button > 0 || event.target.closest('button')) return;
  pointerStartX = event.clientX;
  pointerStartY = event.clientY;
  pointerId = event.pointerId;
  isDragging = false;
  categoryTrack.style.transition = 'none';
  swipeZone.setPointerCapture(event.pointerId);
});

swipeZone.addEventListener('pointermove', event => {
  if (event.pointerId !== pointerId) return;
  const dx = event.clientX - pointerStartX;
  const dy = event.clientY - pointerStartY;
  if (!isDragging) {
    if (Math.abs(dx) < 8 || Math.abs(dx) <= Math.abs(dy) * 1.25) return;
    isDragging = true;
  }
  event.preventDefault();
  const width = swipeZone.clientWidth;
  const offset = (-current * width) + (dx * 0.96);
  categoryTrack.style.transform = 'translateX(' + offset + 'px)';
});

function endPointerDrag(event){
  if (event.pointerId !== pointerId) return;
  const dx = event.clientX - pointerStartX;
  const shouldChange = isDragging && Math.abs(dx) >= swipeZone.clientWidth * 0.5;
  categoryTrack.style.transition = 'transform .28s cubic-bezier(.22,.61,.36,1)';
  pointerId = null;
  isDragging = false;
  goTo(current + (shouldChange ? (dx < 0 ? 1 : -1) : 0));
}

swipeZone.addEventListener('pointerup', endPointerDrag);
swipeZone.addEventListener('pointercancel', endPointerDrag);
</script>
</body>
</html>
