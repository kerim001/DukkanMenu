<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dükkan Çanakkale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF7EF;
    --card: #FFFFFF;
    --brick: #7C2E20;
    --brick-deep: #571F15;
    --ink: #3B2A1D;
    --soft: #8B7A68;
    --line: #EAE0CE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .serif{font-family:"Cormorant Garamond",Georgia,serif;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  img{display:block;}

  /* ================= SPLASH ================= */
  #splash{
    position:fixed;inset:0;background:var(--bg);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;transition:opacity .45s ease, visibility .45s ease;
  }
  #splash.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #splash .logo{width:min(72vw,300px);height:auto;}
  #splash .leaf{width:34px;height:34px;color:var(--brick);margin:26px 0 18px;}
  #splash .place{
    font-size:14px;letter-spacing:0.25em;color:var(--soft);margin:0 0 40px;font-weight:600;
  }
  #splash .rule{width:70px;height:1px;background:var(--line);margin:0 auto 40px;display:none;}
  #splash .cta-label{font-size:15px;color:var(--soft);margin:0 0 14px;}
  #splash .cta-btn{
    width:54px;height:54px;border-radius:50%;border:1.5px solid var(--brick);
    color:var(--brick);display:flex;align-items:center;justify-content:center;
    transition:background .2s ease, color .2s ease;
  }
  #splash .cta-btn:active{background:var(--brick);color:#fff;}

  /* ================= APP SHELL ================= */
  #app{display:none;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
  #app.visible{display:flex;}

  .topbar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px 10px;
  }
  .icon-btn{width:30px;height:30px;color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .brand{display:flex;flex-direction:column;align-items:center;}
  .brand img{height:30px;width:auto;}
  .leaf-icon{width:22px;height:22px;color:var(--brick);}

  .tabbar{
    flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
    padding:6px 18px 14px;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;padding:9px 18px;border-radius:999px;font-size:14.5px;
    color:var(--soft);background:transparent;white-space:nowrap;
    transition:background .2s ease,color .2s ease;
  }
  .tab.active{background:var(--brick);color:#fff;font-weight:600;}

  .hero{
    flex:0 0 auto;position:relative;margin:0 18px;border-radius:20px;overflow:hidden;
    height:34vh;min-height:190px;max-height:260px;background:var(--line);
  }
  .hero .thumb-fallback{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--soft);gap:6px;background:linear-gradient(160deg,#EFE4CC,#E4D6B8);
  }
  .hero .thumb-fallback svg{width:34px;height:34px;opacity:.6;}
  .hero .thumb-fallback span{font-size:12px;letter-spacing:.03em;}
  .hero img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;}
  .hero-scrim{
    position:absolute;inset:0;z-index:2;
    background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.62) 100%);
    pointer-events:none;
  }
  .hero-text{position:absolute;left:18px;right:70px;bottom:16px;z-index:3;color:#fff;}
  .hero-text h2{margin:0 0 4px;font-size:26px;font-weight:700;line-height:1.05;}
  .hero-text p{margin:0;font-size:13.5px;opacity:.92;line-height:1.3;}
  .hero-arrow{
    position:absolute;top:50%;transform:translateY(-50%);z-index:4;
    width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);
    color:var(--brick);display:flex;align-items:center;justify-content:center;
  }
  .hero-arrow.prev{left:12px;}
  .hero-arrow.next{right:12px;}
  .hero-arrow svg{width:16px;height:16px;}

  .pager{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0 4px;}
  .pager .dot{width:5px;height:5px;border-radius:50%;background:var(--brick);}
  .pager .count{font-size:12.5px;letter-spacing:.06em;color:var(--soft);}

  .list{flex:1 1 auto;overflow-y:auto;padding:6px 18px 8px;-webkit-overflow-scrolling:touch;}
  .cat-sub-note{font-size:12.5px;font-style:italic;color:var(--soft);margin:2px 2px 12px;}

  .card{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
  .card:last-child{border-bottom:none;}
  .card-thumb{
    flex:0 0 64px;width:64px;height:64px;border-radius:14px;overflow:hidden;
    position:relative;background:var(--line);
  }
  .card-thumb img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;}
  .card-thumb .thumb-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#EFE4CC,#E4D6B8);color:var(--soft);}
  .card-thumb .thumb-fallback svg{width:20px;height:20px;opacity:.6;}
  .card-body{flex:1 1 auto;min-width:0;}
  .card-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .card-name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:17.5px;color:var(--ink);line-height:1.2;}
  .card-price{flex:0 0 auto;font-size:14.5px;font-weight:600;color:var(--brick);white-space:nowrap;}
  .card-desc{margin:4px 0 0;font-size:13px;color:var(--soft);line-height:1.35;}
  .card.no-desc .card-body{display:flex;align-items:center;}
  .card.no-desc .card-row{width:100%;}

  .scroll-hint{
    display:flex;justify-content:center;padding:6px 0 4px;color:var(--soft);opacity:.6;
    animation:bob 1.6s ease-in-out infinite;
  }
  .scroll-hint svg{width:18px;height:18px;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}
  @media (prefers-reduced-motion: reduce){.scroll-hint{animation:none;}}
</style>
</head>

const THUMB_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2"/><path d="M21 16l-4.5-4.5a2 2 0 0 0-2.8 0L3 21"/></svg>';

const splash = document.getElementById('splash');
const app = document.getElementById('app');
const tabbar = document.getElementById('tabbar');
const list = document.getElementById('list');
const heroImg = document.getElementById('heroImg');
const heroFallback = document.getElementById('heroFallback');
const heroTitle = document.getElementById('heroTitle');
const heroSub = document.getElementById('heroSub');
const pagerCount = document.getElementById('pagerCount');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let current = 0;

function pad(n){ return n < 10 ? '0' + n : '' + n; }

function render(){
  const cat = MENU[current];

  // tabs
  tabbar.innerHTML = '';
  MENU.forEach((c, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (i === current ? ' active' : '');
    tab.textContent = c.name;
    tab.addEventListener('click', () => { current = i; render(); });
    tabbar.appendChild(tab);
    if (i === current) requestAnimationFrame(() => tab.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' }));
  });

  // hero
  heroImg.style.display = '';
  heroImg.src = 'resim.jpg?cat=' + (current + 1); // placeholder — replace with the real photo path for this category
  heroFallback.style.display = 'flex';
  heroTitle.textContent = cat.name;
  heroSub.textContent = cat.tagline || '';
  pagerCount.textContent = pad(current + 1) + ' / ' + pad(MENU.length);

  // list
  list.innerHTML = '';
  if (cat.sub) {
    const note = document.createElement('p');
    note.className = 'cat-sub-note';
    note.textContent = cat.sub;
    list.appendChild(note);
  }
  cat.items.forEach(it => {
    const card = document.createElement('div');
    card.className = 'card' + (it.d ? '' : ' no-desc');

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'card-thumb';
    const fb = document.createElement('div');
    fb.className = 'thumb-fallback';
    fb.innerHTML = THUMB_SVG;
    const img = document.createElement('img');
    img.alt = it.n;
    img.src = 'resim.jpg'; // placeholder — replace with the real photo for "' + it.n + '"
    img.onerror = function(){ this.style.display = 'none'; };
    thumbWrap.appendChild(fb);
    thumbWrap.appendChild(img);
    card.appendChild(thumbWrap);

    const body = document.createElement('div');
    body.className = 'card-body';

    const row = document.createElement('div');
    row.className = 'card-row';
    const name = document.createElement('span');
    name.className = 'card-name';
    name.textContent = it.n;
    row.appendChild(name);
    if (it.p) {
      const price = document.createElement('span');
      price.className = 'card-price';
      price.textContent = it.p;
      row.appendChild(price);
    }
    body.appendChild(row);

    if (it.d) {
      const desc = document.createElement('p');
      desc.className = 'card-desc';
      desc.textContent = it.d;
      body.appendChild(desc);
    }

    card.appendChild(body);
    list.appendChild(card);
  });
  list.scrollTop = 0;
}

prevBtn.addEventListener('click', () => { current = (current - 1 + MENU.length) % MENU.length; render(); });
nextBtn.addEventListener('click', () => { current = (current + 1) % MENU.length; render(); });

document.getElementById('enterBtn').addEventListener('click', () => {
  splash.classList.add('hidden');
  app.classList.add('visible');
  render();
});
</script>
