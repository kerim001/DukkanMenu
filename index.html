<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF7EF">
  <meta name="description" content="Dükkan Çanakkale menüsü">
  <title>Dükkan Çanakkale</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C2E20' stroke-width='1.6'%3E%3Cpath d='M12 21c0-7 3-11 8-13-1 6-2 10-8 13Z'/%3E%3Cpath d='M12 21c0-7-3-11-8-13 1 6 2 10 8 13Z'/%3E%3Cpath d='M12 21V9'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #FBF7EF;
      --card: #FFFFFF;
      --brick: #7C2E20;
      --brick-deep: #571F15;
      --ink: #3B2A1D;
      --soft: #6F5F4E;
      --line: #EAE0CE;
      --hero-h: 168px;
      --gutter: 18px;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    .serif {
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      color: inherit;
    }

    img {
      display: block;
    }

    :focus-visible {
      outline: 2px solid var(--brick);
      outline-offset: 2px;
    }

    /* ===== Karşılama ekranı ===== */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      transition: opacity .45s ease, visibility .45s ease;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #splash .logo {
      width: min(72vw, 300px);
      height: auto;
    }

    #splash .leaf {
      width: 34px;
      height: 34px;
      color: var(--brick);
      margin: 26px 0 18px;
    }

    #splash .place {
      font-size: 14px;
      letter-spacing: 0.25em;
      color: var(--soft);
      margin: 0 0 40px;
      font-weight: 600;
    }

    #splash .cta-label {
      font-size: 15px;
      color: var(--soft);
      margin: 0 0 14px;
    }

    #splash .cta-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1.5px solid var(--brick);
      color: var(--brick);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s ease, color .2s ease;
    }

    #splash .cta-btn:active {
      background: var(--brick);
      color: #fff;
    }

    /* ===== Uygulama iskeleti ===== */
    #app {
      display: none;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #app.visible {
      display: flex;
    }

    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(14px + env(safe-area-inset-top, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px)) 8px max(var(--gutter), env(safe-area-inset-left, 0px));
    }

    .topbar-logo {
      height: 30px;
      width: auto;
      max-width: 55vw;
    }

    .tabbar {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 6px max(var(--gutter), env(safe-area-inset-right, 0px)) 12px max(var(--gutter), env(safe-area-inset-left, 0px));
    }

    .tabbar::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      font-size: 14.5px;
      color: var(--soft);
      white-space: nowrap;
      transition: background .2s ease, color .2s ease;
    }

    .tab.active {
      background: var(--brick);
      color: #fff;
      font-weight: 600;
    }

    #swipeZone {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    #swipeZone.dragging {
      user-select: none;
      -webkit-user-select: none;
    }

    #categoryTrack {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform .28s cubic-bezier(.22, .61, .36, 1);
      will-change: transform;
    }

    .category-panel {
      position: relative;
      flex: 0 0 100%;
      min-height: 0;
      overflow: hidden;
    }

    /* touch-action burada olmalı: dikey kaydırma alanı tarayıcıya, yatay hareket bizim kaydırmamıza ait */
    .list {
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding: 0 max(var(--gutter), env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(var(--gutter), env(safe-area-inset-left, 0px));
    }

    /* ===== Kategori kapağı ===== */
    .hero {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      height: var(--hero-h);
      background: linear-gradient(150deg, var(--brick), var(--brick-deep));
      color: #fff;
    }

    .hero-leaf {
      position: absolute;
      right: -14px;
      top: -14px;
      width: 150px;
      height: 150px;
      opacity: .08;
    }

    .hero-img {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .hero-scrim {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, .62) 100%);
      pointer-events: none;
    }

    .hero:not(.no-photo) :is(.hero-img, .hero-scrim) {
      display: block;
    }

    .hero:not(.no-photo) .hero-leaf {
      display: none;
    }

    .hero-text {
      position: absolute;
      left: 18px;
      right: 64px;
      bottom: 14px;
      z-index: 3;
    }

    .hero-title {
      margin: 0 0 3px;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.05;
    }

    .hero-sub {
      margin: 0;
      font-size: 13.5px;
      opacity: .95;
      line-height: 1.3;
    }

    .hero-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 4;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .88);
      color: var(--brick);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-arrow.prev {
      left: 8px;
    }

    .hero-arrow.next {
      right: 8px;
    }

    .hero-arrow svg {
      width: 16px;
      height: 16px;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 34px;
    }

    .pager .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--brick);
    }

    .pager .count {
      font-size: 12.5px;
      letter-spacing: .06em;
      color: var(--soft);
    }

    .cat-sub-note {
      font-size: 13.5px;
      font-style: italic;
      color: var(--soft);
      margin: 0 2px 8px;
    }

    /* ===== Ürün kartı ===== */
    .card {
      display: flex;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }

    .card:last-child {
      border-bottom: none;
    }

    .card.zoomable {
      cursor: pointer;
    }

    .card.zoomable:active {
      opacity: .7;
    }

    .card-thumb {
      flex: 0 0 64px;
      width: 64px;
      height: 64px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--line);
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      flex: 1 1 auto;
      min-width: 0;
    }

    .card-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .card-name {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 700;
      font-size: 18px;
      line-height: 1.2;
    }

    .card-price {
      flex: 0 0 auto;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--brick);
      white-space: nowrap;
    }

    .card-desc {
      margin: 4px 0 0;
      font-size: 14px;
      color: var(--soft);
      line-height: 1.4;
    }

    /* liste aşağı devam ediyorsa görünür */
    .scroll-hint {
      position: absolute;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--soft);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .scroll-hint.show {
      opacity: .9;
    }

    .scroll-hint svg {
      width: 16px;
      height: 16px;
      animation: bob 1.6s ease-in-out infinite;
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(-1px);
      }

      50% {
        transform: translateY(2px);
      }
    }

    /* ===== Ürün detayı (modal) ===== */
    dialog {
      width: 100%;
      max-width: 520px;
      max-height: 92dvh;
      margin: auto auto 0;
      padding: 0;
      border: none;
      overflow: hidden;
      border-radius: 24px 24px 0 0;
      background: transparent;
      color: var(--ink);
    }

    dialog[open] {
      animation: sheet-up .26s cubic-bezier(.22, .61, .36, 1);
    }

    dialog::backdrop {
      background: rgba(59, 42, 29, .55);
      transition: background .24s ease;
    }

    dialog.is-closing::backdrop {
      background: rgba(59, 42, 29, 0);
    }

    @keyframes sheet-up {
      from {
        transform: translateY(40px);
        opacity: 0;
      }

      to {
        transform: none;
        opacity: 1;
      }
    }

    @media (min-width:600px) {
      dialog {
        margin: auto;
        border-radius: 24px;
      }
    }

    .sheet {
      position: relative;
      max-height: 92dvh;
      overflow-y: auto;
      background: var(--bg);
      touch-action: pan-y;
      transition: transform .22s cubic-bezier(.22, .61, .36, 1);
    }

    .modal-handle {
      position: absolute;
      top: 8px;
      left: 50%;
      z-index: 5;
      width: 42px;
      height: 4px;
      border-radius: 999px;
      background: rgba(59, 42, 29, .28);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .sheet.dragging {
      transition: none;
      user-select: none;
      -webkit-user-select: none;
    }

    dialog.is-closing .sheet {
      transition: transform .24s cubic-bezier(.4, 0, 1, 1);
    }

    .modal-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: var(--line);
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .92);
      color: var(--brick);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    }

    .modal-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-name {
      margin: 0;
      font-size: 26px;
      line-height: 1.1;
      font-weight: 700;
    }

    .modal-price {
      font-size: 17px;
      font-weight: 600;
      color: var(--brick);
      white-space: nowrap;
    }

    .modal-desc {
      margin: 10px 0 0;
      font-size: 15px;
      line-height: 1.5;
      color: var(--soft);
    }

    @media (prefers-reduced-motion: reduce) {

      #categoryTrack,
      .tab,
      #splash {
        transition: none;
      }

      dialog[open],
      .scroll-hint svg {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div id="splash">
    <img class="logo" src="logo.png" alt="Dükkan — Your Daily Escape" fetchpriority="high" decoding="async">
    <svg class="leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
      <path d="M12 21c0-7 3-11 8-13-1 6-2 10-8 13Z" />

    <p class="cta-label">Menüyü keşfet</p>

  <div id="app">

    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Menü kategorileri"></nav>
    <div id="swipeZone">
      <div id="categoryTrack"></div>
    </div>
  </div>

  <dialog id="modal" aria-labelledby="modalName">
    <div class="sheet">
      <span class="modal-handle" aria-hidden="true"></span>
      <button class="modal-close" id="modalClose" aria-label="Kapat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18" />
          <line x1="18" y1="6" x2="6" y2="18" />
        </svg>
      </button>
      <img class="modal-img" id="modalImg" alt="">
      <div class="modal-body">
        <div class="modal-head">
          <h3 class="modal-name serif" id="modalName"></h3>
          <span class="modal-price" id="modalPrice"></span>
        </div>
        <p class="modal-desc" id="modalDesc"></p>
      </div>
    </div>
  </dialog>

  <template id="panelTpl">
    <section class="category-panel" role="tabpanel">
      <div class="list">
        <div class="hero no-photo">
          <svg class="hero-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"
            aria-hidden="true">
            <path d="M12 21c0-7 3-11 8-13-1 6-2 10-8 13Z" />
            <path d="M12 21c0-7-3-11-8-13 1 6 2 10 8 13Z" />
            <path d="M12 21V9" />

          <img class="hero-img" alt="" decoding="async">
          <div class="hero-scrim"></div>
          <button class="hero-arrow prev" aria-label="Önceki kategori">

              stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <button class="hero-arrow next" aria-label="Sonraki kategori">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
          <div class="hero-text">
            <h2 class="hero-title serif"></h2>
            <p class="hero-sub"></p>
          </div>
        </div>
        <div class="pager" aria-hidden="true">
          <span class="dot"></span>
          <span class="count"></span>
        </div>
        <p class="cat-sub-note" hidden></p>
        <div class="items"></div>
      </div>
      <div class="scroll-hint" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </div>
    </section>
  </template>

    /* =====================================================================
       UYGULAMA
       ===================================================================== */
    const ASSET_VERSION = '20260919-2';   // fotoğrafları güncelleyince değiştir: tarayıcı önbelleği yenilenir

    const splash = document.getElementById('splash');
    const app = document.getElementById('app');
    const tabbar = document.getElementById('tabbar');
    const swipeZone = document.getElementById('swipeZone');
    const track = document.getElementById('categoryTrack');
    const panelTpl = document.getElementById('panelTpl');
    const modal = document.getElementById('modal');

    const tabs = [];
    const panels = [];
    let current = 0;

    /* ---------- yardımcılar ---------- */
    const pad = n => String(n).padStart(2, '0');
    const withVersion = src => src + '?v=' + ASSET_VERSION;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    /* ---------- ürün kartı ---------- */
    function buildCard(item) {
      const card = el('div', 'card');

      if (item.image) {
        const thumb = el('div', 'card-thumb');
        const img = el('img');
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.dataset.src = withVersion(item.image);           // loadPanel() gerektiğinde yükler
        img.addEventListener('error', () => thumb.remove());  // dosya yoksa alan hiç görünmez
        thumb.append(img);
        card.append(thumb);
        makeZoomable(card, item);                            // görsel yüklenmesini beklemeden açılabilir
      }

      const body = el('div', 'card-body');
      const row = el('div', 'card-row');
      row.append(el('span', 'card-name', item.n));
      if (item.p) row.append(el('span', 'card-price', item.p));
      body.append(row);
      if (item.d) body.append(el('p', 'card-desc', item.d));
      card.append(body);

      return card;
    }

    // Fotoğrafı gerçekten yüklenen kartlar tıklanabilir olur
    function makeZoomable(card, item) {
      card.classList.add('zoomable');
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', item.n + ' — fotoğrafı büyüt');
      card.addEventListener('click', () => {
        openModal(item);
      });
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(item); }
      });
    }

    /* ---------- kategori paneli ---------- */
    function buildPanel(cat, i) {
      const panel = panelTpl.content.firstElementChild.cloneNode(true);
      const $ = selector => panel.querySelector(selector);
      const hero = $('.hero');
      const heroImg = $('.hero-img');

      panel.id = 'panel-' + i;
      panel.setAttribute('aria-labelledby', 'tab-' + i);

      $('.hero-title').textContent = cat.name;
      $('.hero-sub').textContent = cat.tagline || '';
      $('.count').textContent = pad(i + 1) + ' / ' + pad(MENU.length);
      $('.prev').hidden = i === 0;
      $('.next').hidden = i === MENU.length - 1;
      $('.prev').addEventListener('click', () => goTo(i - 1));
      $('.next').addEventListener('click', () => goTo(i + 1));

      // Kapak fotoğrafı yüklenirse marka renkli zemin yerini ona bırakır
      if (cat.image) heroImg.dataset.src = withVersion(cat.image);
      heroImg.addEventListener('load', () => hero.classList.remove('no-photo'));

      if (cat.sub) {
        const note = $('.cat-sub-note');
        note.textContent = cat.sub;
        note.hidden = false;
      }

      $('.items').append(...cat.items.map(buildCard));
      $('.list').addEventListener('scroll', () => updateHint(i), { passive: true });
      return panel;
    }

    // Görselleri sadece aktif ve komşu paneller için yükle
    function loadPanel(i) {
      panels[i]?.querySelectorAll('img[data-src]').forEach(img => {
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      });
    }

    // "Aşağı kaydır" oku sadece liste devam ediyorsa görünür
    function updateHint(i) {
      const list = panels[i]?.querySelector('.list');
      if (!list) return;
      const hasMore = list.scrollHeight - list.clientHeight - list.scrollTop > 24;
      panels[i].querySelector('.scroll-hint').classList.toggle('show', hasMore);
    }

    /* ---------- gezinme ---------- */
    function centerTab(tab, smooth) {
      const left = tab.offsetLeft - (tabbar.clientWidth - tab.offsetWidth) / 2;
      tabbar.scrollTo({ left, behavior: smooth ? 'smooth' : 'auto' });
    }

    function goTo(i, instant) {
      i = Math.max(0, Math.min(MENU.length - 1, i));
      const jump = instant || Math.abs(i - current) > 1;   // uzak atlamada aradaki panelleri kaydırma
      if (jump) track.style.transition = 'none';
      current = i;
      track.style.transform = 'translateX(' + (-i * 100) + '%)';
      if (jump) { void track.offsetWidth; track.style.transition = ''; }

      tabs.forEach((tab, idx) => {
        const active = idx === i;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', active);
        tab.tabIndex = active ? 0 : -1;
      });
      panels.forEach((panel, idx) => { panel.inert = idx !== i; });
      centerTab(tabs[i], !instant);

      loadPanel(i - 1);
      loadPanel(i);
      loadPanel(i + 1);
      updateHint(i);
    }

    /* ---------- ürün detayı (modal) ---------- */
    function openModal(item) {
      const img = document.getElementById('modalImg');
      const price = document.getElementById('modalPrice');
      const desc = document.getElementById('modalDesc');

      img.removeAttribute('src');               // önceki ürünün fotoğrafı bir an görünmesin
      img.src = withVersion(item.image);        // listede yüklendiği için önbellekten anında gelir
      document.getElementById('modalName').textContent = item.n;
      price.textContent = item.p || '';
      price.hidden = !item.p;
      desc.textContent = item.d || '';
      desc.hidden = !item.d;

      modal.classList.remove('is-closing');
      sheet.style.transform = '';
      modal.showModal();
    }

    document.getElementById('modalClose').addEventListener('click', () => modal.close());
    modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });   // boşluğa dokununca kapanır

    /* ---------- detay penceresini aşağı sürükleyerek kapatma ---------- */
    const sheet = modal.querySelector('.sheet');
    const modalDrag = { pointerId: null, startY: 0, active: false, touch: false };

    sheet.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'pen' || e.target.closest('button') || sheet.scrollTop > 0) return;
      modalDrag.pointerId = e.pointerId;
      modalDrag.startY = e.clientY;
      modalDrag.active = false;
    });

    function moveModalDrag(event, y) {
      const distance = y - modalDrag.startY;
      if (distance <= 0) return;
      if (!modalDrag.active && distance < 8) return;

      modalDrag.active = true;
      if (modalDrag.pointerId !== null) {
        try {
          sheet.setPointerCapture(modalDrag.pointerId);
        } catch {
          // Pointer tarayici tarafindan zaten birakildiysa hareketi yine de tamamla.
        }
      }
      sheet.classList.add('dragging');
      if (event.cancelable) event.preventDefault();
      sheet.style.transform = 'translateY(' + Math.min(distance * .92, 220) + 'px)';
    }

    function finishModalDrag(y, cancelled) {
      const distance = y - modalDrag.startY;
      const shouldClose = !cancelled && modalDrag.active && distance >= 80;
      modalDrag.pointerId = null;
      modalDrag.active = false;

      if (shouldClose) {
        sheet.classList.remove('dragging');
        modal.classList.add('is-closing');
        sheet.style.transform = 'translateY(100%)';
        window.setTimeout(() => {
          sheet.style.transform = '';
          modal.classList.remove('is-closing');
          modal.close();
        }, 220);
      } else {
        sheet.classList.remove('dragging');
        sheet.style.transform = '';
      }
    }

    sheet.addEventListener('pointermove', e => {
      if (e.pointerId === modalDrag.pointerId) moveModalDrag(e, e.clientY);
    });
    sheet.addEventListener('pointerup', e => {
      if (e.pointerId === modalDrag.pointerId) finishModalDrag(e.clientY, false);
    });
    sheet.addEventListener('pointercancel', e => {
      if (e.pointerId === modalDrag.pointerId) finishModalDrag(e.clientY, true);
    });

    // Mobile Chrome/Opera fallback: touch events continue even when pointer capture is cancelled.
    sheet.addEventListener('touchstart', e => {
      if (e.touches.length !== 1 || e.target.closest('button') || sheet.scrollTop > 0) return;
      modalDrag.touch = true;
      modalDrag.pointerId = null;
      modalDrag.startY = e.touches[0].clientY;
      modalDrag.active = false;
    }, { passive: false });
    sheet.addEventListener('touchmove', e => {
      if (!modalDrag.touch || e.touches.length !== 1) return;
      moveModalDrag(e, e.touches[0].clientY);
    }, { passive: false });
    sheet.addEventListener('touchend', e => {
      if (!modalDrag.touch) return;
      modalDrag.touch = false;
      finishModalDrag(e.changedTouches[0].clientY, false);
    }, { passive: false });
    sheet.addEventListener('touchcancel', () => {
      if (!modalDrag.touch) return;
      modalDrag.touch = false;
      finishModalDrag(modalDrag.startY, true);
    }, { passive: false });

    /* ---------- yatay kaydırma (tek yöntem: pointer events) ---------- */
    const drag = { pointerId: null, startX: 0, startY: 0, startTime: 0, active: false, suppressClick: false };

    swipeZone.addEventListener('pointerdown', e => {
      if ((e.pointerType === 'mouse' && e.button !== 0) || e.target.closest('button')) return;
      drag.suppressClick = false;
      Object.assign(drag, { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, startTime: performance.now(), active: false });
    });

    swipeZone.addEventListener('pointermove', e => {
      if (e.pointerId !== drag.pointerId) return;
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;

      if (!drag.active) {
        if (Math.abs(dx) < 10 || Math.abs(dx) <= Math.abs(dy) * 1.25) return;   // yatay niyet yoksa dokunma
        drag.active = true;
        swipeZone.setPointerCapture(e.pointerId);
        swipeZone.classList.add('dragging');
        track.style.transition = 'none';
      }

      const atEdge = (dx > 0 && current === 0) || (dx < 0 && current === MENU.length - 1);
      const offset = -current * swipeZone.clientWidth + (atEdge ? dx * 0.3 : dx);
      track.style.transform = 'translateX(' + offset + 'px)';
    });

    function endDrag(e, cancelled) {
      if (e.pointerId !== drag.pointerId) return;
      const wasActive = drag.active;
      const dx = e.clientX - drag.startX;
      const elapsed = Math.max(performance.now() - drag.startTime, 1);
      drag.pointerId = null;
      drag.active = false;
      if (!wasActive) return;

      drag.suppressClick = true;
      swipeZone.classList.remove('dragging');
      track.style.transition = '';

      const flicked = Math.abs(dx) > 30 && Math.abs(dx) / elapsed > 0.5;          // hızlı fırlatma
      const draggedFar = Math.abs(dx) >= swipeZone.clientWidth * 0.22;             // veya ekranın ~%22'si
      const changePage = !cancelled && (flicked || draggedFar);
      goTo(current + (changePage ? (dx < 0 ? 1 : -1) : 0));
    }
    swipeZone.addEventListener('pointerup', e => endDrag(e, false));
    swipeZone.addEventListener('pointercancel', e => endDrag(e, true));
    swipeZone.addEventListener('click', e => {
      if (!drag.suppressClick) return;
      e.preventDefault();
      e.stopPropagation();
      drag.suppressClick = false;
    }, true);

    /* ---------- başlatma ---------- */
    MENU.forEach((cat, i) => {
      const tab = el('button', 'tab', cat.name);
      tab.id = 'tab-' + i;
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-controls', 'panel-' + i);
      tab.addEventListener('click', () => goTo(i));
      tabbar.append(tab);
      tabs.push(tab);

      const panel = buildPanel(cat, i);
      track.append(panel);
      panels.push(panel);
    });
    goTo(0, true);   // ilk kategorinin görselleri karşılama ekranındayken yüklenmeye başlar

    document.getElementById('enterBtn').addEventListener('click', () => {
      splash.classList.add('hidden');
      splash.inert = true;
      app.classList.add('visible');
      centerTab(tabs[current], false);
      updateHint(current);
    });

    window.addEventListener('resize', () => updateHint(current));

    document.addEventListener('keydown', e => {
      if (!app.classList.contains('visible') || modal.open) return;
      if (e.key === 'ArrowRight') goTo(current + 1);
      if (e.key === 'ArrowLeft') goTo(current - 1);
    });
  </script>
